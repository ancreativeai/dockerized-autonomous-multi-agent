server {
    listen 80;
    root /usr/share/nginx/html;
    autoindex on;

    location / {
        try_files /workspaces/openclaw/knowledge-graph.html =404;
    }
    location /reports/ {
        alias /usr/share/nginx/html/workspaces/openclaw/reports/;
        autoindex on;
        default_type text/plain;
    }
    location /vault/ {
        alias /usr/share/nginx/html/vault/;
        autoindex on;
        default_type text/plain;
    }
}
