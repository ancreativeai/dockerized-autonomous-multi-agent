# Automated VPS deployment over Tailscale (architecture checkpoint, phase 4).
#
# Dormant until these repository secrets are configured
# (Settings -> Secrets and variables -> Actions):
#   TS_OAUTH_CLIENT_ID / TS_OAUTH_SECRET  Tailscale OAuth client (scope: auth_keys,
#                                         with tag:ci) from https://login.tailscale.com/admin/settings/oauth
#   VPS_HOST                              VPS tailnet name or 100.x.y.z address
#   VPS_USER                              SSH user on the VPS (e.g. deploy)
#   VPS_SSH_KEY                           private key whose public half is in the
#                                         VPS user's authorized_keys
#
# VPS prerequisites: docker + compose, tailscale joined to the same tailnet,
# and the repo cloned at ~/dockerized-autonomous-multi-agent with a filled .env.
name: Deploy

on:
  push:
    branches: [dockerized-autonomous-multi-agent]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check whether deploy secrets are configured
        id: check
        run: |
          if [ -n "${{ secrets.VPS_HOST }}" ] && [ -n "${{ secrets.TS_OAUTH_CLIENT_ID }}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Deploy secrets not set — skipping (this is expected until the VPS exists)."
          fi

      - name: Join tailnet
        if: steps.check.outputs.configured == 'true'
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Deploy over SSH
        if: steps.check.outputs.configured == 'true'
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=accept-new \
              "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" <<'REMOTE'
            set -euo pipefail
            cd ~/dockerized-autonomous-multi-agent
            git fetch origin
            git reset --hard origin/dockerized-autonomous-multi-agent
            docker compose build --pull
            docker compose up -d
            docker compose ps
          REMOTE
